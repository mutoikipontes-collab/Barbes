name: Fotos das telas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: |
          mkdir -p shots
          npx vite preview --port 4173 &
          sleep 3
          node scripts/screenshots.mjs
      - run: |
          cd shots
          git init -q -b screenshots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "fotos das telas"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
